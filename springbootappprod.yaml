version: "3.7"
services:
  mysql:
    image: mysql:oraclelinux9
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=ecommercewebsite
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  ecomapp:
    image: abishek1710/ecommercewebsitespringbootappabishek:latest
    ports:
      - 8080:8080
    environment:
      - DB_URL=${DB_URL}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
